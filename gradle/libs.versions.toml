[versions]
kotlin = "2.2.0"
appCompat = "1.7.1"
core = "1.16.0"
material = "1.12.0"
navigationFragment = "2.9.3"
navigationUI = "2.9.3"
recyclerviewSelection = "1.2.0"
recyclerview = "1.4.0"
hilt = "2.57"
viewbindingDelegate = "1.5.9"
junit = "1.1.3"
espressoCore = "3.4.0"
diffease = "1.2.2"
gradleplugin = "8.12.0"
ksp = "2.2.0-2.0.2"
detektAnalyzer = "1.23.8"

[libraries]
androidx-core = { group = "androidx.core", name = "core-ktx", version.ref = "core" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appCompat" }
android-gradle-plugin = { module = "com.android.tools.build:gradle", name = "gradle-plugin", version.ref = "gradleplugin" }
navigation-fragment = { group = "androidx.navigation", name = "navigation-fragment-ktx", version.ref = "navigationFragment" }
navigation-fragment-ui = { group = "androidx.navigation", name = "navigation-ui-ktx", version.ref = "navigationUI" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
recyclerview = { group = "androidx.recyclerview", name = "recyclerview", version.ref = "recyclerview" }
recyclerviewSelection = { group = "androidx.recyclerview", name = "recyclerview-selection", version.ref = "recyclerviewSelection" }
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "hilt" }
hilt-gradle-plugin = { group = "com.google.dagger", name = "hilt-android-gradle-plugin", version.ref = "hilt" }
viewbindingDelegate = { group = "com.github.kirich1409", name = "viewbindingpropertydelegate-noreflection", version.ref = "viewbindingDelegate" }
diffease = { group = "io.github.nuclominus", name = "diffease", version.ref = "diffease" }
kotlin-gradle-plugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }
detekt-gradle-plugin = { group = "io.gitlab.arturbosch.detekt", name = "detekt-gradle-plugin", version.ref = "detektAnalyzer" }

[plugins]
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
google-ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
detekt-analyzer = { id = "io.gitlab.arturbosch.detekt", version.ref = "detektAnalyzer" }
nuclominus-application = { id = "io.nuclominus.android.application", version = "unspecified" }
nuclominus-library = { id = "io.nuclominus.android.library", version = "unspecified" }